name: verify

# 这条流水线只做一件事：确认「正文里的每个数字都能从落盘数据重算出来」。
# 它不重跑构建实验（那需要厂商软件源、UOS 的 ISO 与几十 GB 中间产物），
# 只重跑 raw/ → derived/ → figures/ → 断言核对。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plotting deps
        run: python -m pip install --quiet matplotlib numpy

      - name: Install CJK fonts for figures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Rebuild derived/ from raw/
        run: python3 scripts/analyze.py

      - name: Fail if derived/ drifted from raw/
        run: |
          if ! git diff --quiet -- derived/; then
            echo "::error::derived/ 与 raw/ 不一致——请在本地重跑 scripts/analyze.py 并提交结果"
            git diff --stat -- derived/
            exit 1
          fi

      # 图不做逐字节比对：PNG 字节取决于 matplotlib / freetype / 已装字体的版本，
      # 跨机本来就不可能一致（我先加了字节门禁，CI 立刻红——本地同机能过，
      # runner 上六张全不同）。跨机真能成立的判据只有：plot.py 干净跑完、
      # 产出恰好 6 张、每张都不是空图。同机的字节复算留在本地 review 流程里。
      - name: Rebuild figures
        run: |
          python3 scripts/plot.py
          n=$(ls figures/*.png 2>/dev/null | wc -l)
          [ "$n" -eq 6 ] || { echo "::error::图基线 6 张，实际 $n 张（改了张数请同步基线与正文）"; exit 1; }
          small=0
          for f in figures/*.png; do
            b=$(stat -c%s "$f")
            [ "$b" -ge 10000 ] || { echo "::error::$f 只有 $b 字节，疑似空图"; small=1; }
          done
          [ "$small" -eq 0 ] || exit 1
          # 真正要防的是「图画着旧数据」。plot.py 会把每张图实际画进去的数值与文字
          # 落进 figures/plotdata.json，这份是机器无关的（实测换字体重跑逐字节不变，
          # 而 PNG 六张全变），所以拿它比漂移。
          if ! git diff --quiet -- figures/plotdata.json; then
            echo "::error::figures/plotdata.json 与 derived/ 不一致——图画的是旧数据，请重跑 scripts/plot.py 并提交"
            git diff -- figures/plotdata.json | head -40
            exit 1
          fi
          echo "figures: $n 张重画成功，plotdata.json 零漂移"

      - name: Shell syntax check on the whole build chain
        run: |
          fail=0; n=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || fail=1; n=$((n+1)); done
          # 同上：git ls-files 一旦返回空，循环零次、exit 0，语法检查就整段空转。
          [ "$n" -ge 20 ] || { echo "::error::只检查了 $n 个脚本，低于基线 20"; fail=1; }
          echo "bash -n: $n 个脚本"
          exit $fail

      # raw/d4_gates.json 自称来自 artifacts/f4-*.log，但那一步从不在 CI 里重跑，
      # 于是改了日志不会有任何东西报警（审稿实测：把「通过 365」改成 300，全绿）。
      - name: Re-derive d4 from the committed gate logs and fail on drift
        run: |
          cp raw/d4_gates.json /tmp/d4.before
          python3 scripts/collect_d4_gates.py
          # 只比内容，不比 collected_at —— 那个字段每次重采都变，
          # 直接 git diff 会让这一步永远失败（本地实测过，别再踩）。
          python3 - <<'EOF'
          import json, sys
          a = json.load(open("/tmp/d4.before")); b = json.load(open("raw/d4_gates.json"))
          a.pop("collected_at", None); b.pop("collected_at", None)
          if a != b:
              print("::error::raw/d4_gates.json 与 artifacts/f4-*.log 不一致 —— "
                    "门禁日志被改过，或 d4 未随日志重采")
              sys.exit(1)
          print("d4 与门禁日志一致")
          EOF
          git checkout -- raw/d4_gates.json

      # 与上面的 d4 同构：d3 撑着全文最常引的那组数（648 格 / 398 / 52 / 198、
      # devel_cxx_ok），而 collect_d3 默认就从 artifacts/caps-*.txt 读、不需要 docker。
      # 不做这一步，改 caps-*.txt 里任意一格（审稿实测 compile_cxx=N→Y）全链都不会响。
      - name: Re-derive d3 from the committed probe outputs and fail on drift
        run: |
          cp raw/d3_capabilities.json /tmp/d3.before
          python3 scripts/collect_d3_capabilities.py
          python3 - <<'EOF'
          import json, sys
          a = json.load(open("/tmp/d3.before")); b = json.load(open("raw/d3_capabilities.json"))
          for d in (a, b):
              d.pop("collected_at", None); d.pop("source_dir", None)
              for v in d.get("probes", {}).values():
                  v.pop("_probe_mtime", None); v.pop("_image_created", None)
          if a != b:
              print("::error::raw/d3_capabilities.json 与 artifacts/caps-*.txt 不一致 —— "
                    "探针输出被改过，或 d3 未随探针重采")
              sys.exit(1)
          print("d3 与探针输出一致")
          EOF
          git checkout -- raw/d3_capabilities.json

      - name: Machine-check every claim in report.md / README.md
        run: python3 scripts/verify.py

      # 给分析层做的门禁自己也要被执行 —— 否则又是「门禁没有门禁」
      - name: Mutation-test the analysis layer itself
        run: ./test/mutation-docs.sh
