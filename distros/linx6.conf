# 凝思安全操作系统 V6.0.100 主线 — Debian 系
#
# 为什么把它列为第五个被试：见 report.md §2.5。它扩的维度是**场景类型**——
# ⚠️ 凝思没有独立命名的「桌面版」产品，官网四大场景是服务器 / 图形工作站 /
#    装置专用 / 工业互联网。其中「图形工作站」指电力调度台与变电站综自后台的
#    操作员席位，**不是通用办公终端**。所以本被试对标的是那类席位环境，
#    档位定位与能力矩阵的解读都要按这个前提，不能读成办公 PC。
#
# ⚠️ 取材必须取主线而非欧拉版：download/os/el/ 与 6.0.99 的 el20.03 是
#    **openEuler 分支（rpm）**，与 report §2.5 引作 deb 血统证据的
#    V6.0.80 发布说明（grub2 2.06-3~deb10u4linx5、iceweasel）不是一条产品线。
#    取 el 版等于把麒麟信安那份 rpm 工作重做一遍，且让「扩场景类型」失去意义。
#
# ⚠️ 主线最新是 6.0.100（2023-08-22）。更新的 V8 与 6.0-g2 目录返回 401 Basic auth，
#    同级 6.0.99 是 200 —— 即最新版拿不到，本被试用的是可匿名获取的最新主线版本。
DID=linx6
DISPLAY_NAME="凝思安全操作系统 V6.0.100"
IMAGE=linx-os-v6
FAMILY=deb
METHOD=selfhost                   # 两阶段自举，与 kylin10 同路径 —— 原因见下
# ⚠️ 为什么不是 mmdebstrap/debmedia：凝思的 dpkg 是 1.19（Debian 10），在 Debian 13 的
#    builder 上跑 mmdebstrap 的 essential 变体会**死锁**：CPU 归零、dpkg 变僵尸、
#    父进程停在 pipe_read 永不返回，且不报任何错误（实测三次，每次等 20 分钟）。
#    这与 kylin10 那个「宿主 dpkg 1.22 写的 status，目标 dpkg 1.19.7 解析不了」
#    是同一根因的另一种表现形式——那次是解析失败，这次是死锁。
#    验证：同一介质用 --variant=extract（不在 chroot 里跑目标 dpkg）0.75 秒即成功。
#    所以走 debootstrap --foreign 只解包、导入容器后用凝思自己的 dpkg 完成 --second-stage。
#    实测第二阶段配置 147 个包成功；容器需 --privileged，否则报
#    「Cannot install into target '/' mounted with noexec」（rootless docker 默认挂载）。
                                  # 实测 dists/buster/Release 写着 Codename: buster、
                                  # Date: Tue, 22 Aug 2023 —— Debian 10 血统由此成为一手实测而非旁证
ISO_URL="https://www.linx-info.com/download/os/6.0.100/x86_64/linxos-6.0.100-20230822-x86_64-DVD.iso"
ISO_MD5=851468218404d48356ff2e2112a0933d      # 官方 md5sum.txt，本地实测逐位匹配
ISO_SHA256=4b061ff06650df59f3cd37544c9c43a44ff7decb5a1255fe836561a9cdfc7fe0
ISO_BYTES_EXPECT=4691312640
MEDIA_DIR=lx
MIRROR=file:///w/media/lx        # 介质本地源，无签名（完整性由 ISO 的官方 md5 + sha256 兜）
NO_CHECK_GPG=yes
DEBOOTSTRAP_SCRIPT=/usr/share/debootstrap/scripts/buster                      # media/lx —— 从 ISO 拷出的 dists/ + pool/（4.4 GB）
COMPONENTS=main
SUITE=buster
USRMERGE=no
# ABI 基线：从介质 deb 实测（libc6_2.28-10-linx2、libstdc++6_8.3.0-6-linx2 里的 so.6.0.25）
EXPECT_GLIBC=2.28
EXPECT_LIBSTDCPP=6.0.25
EXPECT_GLIBCXX=3.4.25
IMMUTABLE=no
# linx-noroot-conf 是凝思的安全加固包，第二阶段配置必然失败（容器里没有它要的内核侧支持）。
# 与麒麟排除 kysec2-package-plugins 同理：厂商的内核态加固件在容器内不适用，
# 不装才是正确的等价环境，而不是让它失败后留下未配置状态。
# PIN_NEVER 有两个作用点，对内核包只在其中一个上有效，这一点要写清楚：
#   · debootstrap --exclude —— **无效**。内核包是作为依赖被拉进来的，--exclude
#     管不到；实测加了之后重建，linux-image-* 照样在库里。
#   · 阶段 3 从 stage 缓存 dpkg 补装时的文件名过滤 —— **有效**。它避免白解包
#     256 MB 内核文件再删掉，micro 档因此从 268 MB 降到 266 MB。
# 幽灵内核包登记本身（缺陷 D18）由 lib/common.sh 在删 /boot 与 /lib/modules 的
# 同一处 purge 掉 —— 修在不一致产生的地方，而不是修在它露头的地方。
PIN_NEVER="linx-noroot-conf initramfs-tools linux-image-4.19.0-11-linx-security-amd64-unsigned"
# ⚠️ 包名按 Debian 10（buster）而非 12/13：libgcc-s1 在这里叫 libgcc1、
#    libstdc++-dev 叫 libstdc++-8-dev；介质里没有 zstd CLI（只有 libzstd1），
#    所以 base 档不含 zstd —— 能力矩阵里该项会如实记为缺口而不是悄悄跳过。
# 第一阶段（debootstrap --foreign）额外解包的东西：第二阶段要用 apt 装档位包，
# 所以 apt 与它的依赖必须在 stage 里就位。凝思无 gpgv 需求（介质源不验签）。
STAGE_INCLUDE="apt,apt-utils,ca-certificates,locales,tzdata,libstdc++6"
MICRO_INCLUDE="libc6,libc-bin,libstdc++6,libgcc1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
BASE_INCLUDE="iproute2,iputils-ping,vim-tiny,lsof,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
DEVEL_INCLUDE="gcc,make,libc6-dev,g++,libstdc++-8-dev,binutils,dpkg-dev"

# 显式钉死时间锚点。不写的话 lib/common.sh::derive_epoch 会走「非 http 源」那一支
# 静默回落到硬编码的 1700000000 —— 值是确定的、逐位复现照样成立，但复核者读这份
# conf 找不到时间锚点从哪来，而 §9.1 正批评那个静默回落。显式优于隐式。
# 取值与回落值一致，所以此前的产物哈希不变。
SOURCE_DATE_EPOCH=1700000000

# 凝思自带的 shadow 套件（passwd 1:4.5-1.1linx9）在第二阶段创建 /etc/shadow 时
# 产出 0660，比 Debian 同期的 0640 多一个组写位。既无 dpkg-statoverride 记录、
# 也无 postinst 显式 chmod，是该套件自身行为。按等价环境原则不改厂商行为。
# ⚠️ 措辞分寸：这是**本构建路径下**的实测，没有真机可比对，不等于「凝思真机如此」。
EXPECT_SHADOW=0:42/660
