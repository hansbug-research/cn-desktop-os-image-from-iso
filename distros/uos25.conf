# 统信 UOS 桌面专业版 V25 (2500u1, snipe) — deb 系 + OSTree 不可变
# 它是 immutable OS（apt/apt-get/dpkg 都是 deepin-immutable-ctl 适配器），OS 分发走 OSTree + 玲珑，
# 唯一路径：ISO Range 抽 squashfs -> unsquashfs -> 按包闭包切片
# 更正（原先写「在线源全 401」）：实测只有两个需订阅授权的专业源返回 401，appstore 源是通的；
# 把那两个源注释掉之后 apt-get update 成功、apt check 干净。但源里只有应用商店的 GUI 应用
# （实测源提供 2496 个包），没有 OS 包，所以「装不了 OS 包」的结论不变，理由从「源全挂」
# 变成了「源里没有」。见 report.md §6.2 与 §9.2。
DID=uos25
DISPLAY_NAME="统信 UOS 桌面专业版 V25"
IMAGE=uos-desktop-v25
FAMILY=deb
METHOD=slice
ISO_URL="https://cdimage-download.chinauos.com/desktop-professional/2500u1/beta/uos-desktop-25-professional-2500-amd64-202604.iso"
ISO_SQUASHFS_PATH="live/filesystem.squashfs"
SQUASHFS_SHA256=e1e2f90567a9cb1dd4e743d5b76f43f95d7895b3da154d4093b5a100dfe8a728
SRC_ROOTFS=/w/build/uos25r
ADMINDIR="usr/lib/dpkg/var"        # UOS 把 dpkg 数据库搬到 /usr 下（配合 OSTree /var 分离）
USRMERGE=yes
EXPECT_GLIBC=2.38
EXPECT_LIBSTDCPP=6.0.30
EXPECT_GLIBCXX=3.4.30
IMMUTABLE=yes                     # apt/dpkg 是适配器，容器内无法装包（真机亦然）
SLICE_MICRO="libc6,libc-bin,libstdc++6,libgcc-s1,bash,dash,coreutils,dpkg,base-files,base-passwd,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,mawk,hostname,ncurses-base,ncurses-bin,debianutils,login,util-linux,locales"
SLICE_BASE_EXTRA="iproute2,iputils-ping,vim-tiny,lsof,zstd,unzip,apt,apt-utils,gpgv,passwd,adduser,python3,curl,procps,less,file,xz-utils,systemd,systemd-sysv,dbus"
# ⚠️ UOS V25 桌面自身只装了 C 编译器，没有 g++/libstdc++-dev（apt 源里也没有：那是应用商店源，不含 OS 包），
#    所以 devel 档只能做 C，不能做 C++。C++ 请用 manylinux_2_28 交叉验证。
SLICE_DEVEL_EXTRA="gcc,gcc-12,cpp-12,make,libc6-dev,binutils,dpkg-dev"
# 可复现性锚点：squashfs 的 mkfs 时间（2026-04-10），保证同一 ISO -> 同一产物
SOURCE_DATE_EPOCH=1775779200

# 说明：UOS 的 ISO 里**没有** g++ / cmake / git / strace / gdb
# / python3 头文件（已实测 1636 个包的 ISO 内容）。它又没有 apt 形式的 OS 软件源
# （源只提供 2496 个包，全来自应用商店），所以这些能力在 UOS 镜像上是**硬缺口**，
# 补不了 —— 不是切片切漏了。需要时只能自行 vendor 或换用麒麟镜像做构建。

EXPECT_SHADOW=0:42/640
