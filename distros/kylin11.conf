# 银河麒麟桌面操作系统 V11 (2603) — deb 系，上游 openKylin 2.0
DID=kylin11
DISPLAY_NAME="银河麒麟桌面 V11"
IMAGE=kylin-desktop-v11
FAMILY=deb
METHOD=mmdebstrap                 # 在线源可 bootstrap
MIRROR=http://archive.kylinos.cn/kylin/KYLIN-ALL/
SUITE=11.0
COMPONENTS="main universe"
USRMERGE=yes                      # base-files 不带 usr-merge 符号链接，需 merged-usr hook
ADMINDIR="var/lib/dpkg"
# 预期基线（来自 ISO casper/filesystem.manifest，用于验收对账）
EXPECT_GLIBC=2.38
EXPECT_LIBSTDCPP=6.0.32
EXPECT_GLIBCXX=3.4.32
# 需要重打包的厂商坏包：libboundscheck 把 Build-Depends 写成了 Depends: g++, gcc
REPACK_DEBS="pool/universe/libb/libboundscheck/libboundscheck_1.0.0-ok3k0.1_amd64.deb"
# 假包要满足的依赖（内核侧组件，容器无意义）
STUB_PROVIDES="initramfs-tools, tpm-udev, deb-host-gnu-type-secure, check-secure"
# 钉成永不安装（依赖由 container-stub 的 Provides 满足）：
#  initramfs-tools/tpm-udev  容器共享宿主内核，装真包会按宿主 uname -r 打 initrd
#  deb-host-gnu-type-secure  内容只有 /usr/share/doc，preinst 调 dpkg-architecture 却不 Pre-Depends dpkg-dev
# kysec2-package-plugins 往 /var/lib/dpkg/plugins/ 装 ksaf_label.so + spro.so，
# 麒麟给 dpkg 打了补丁去 dlopen 它们。这两个插件依赖内核态 KYSEC LSM，容器里没有，
# 于是 dpkg 在写状态日志时 SIGSEGV —— 这就是所有 dpkg 段错误的**真正根因**。
# 该包的全部内容就是这两个 .so（外加 /usr/share/doc），也没有任何包依赖它，
# 所以直接不装是干净的根治，不需要假包。
PIN_NEVER="initramfs-tools tpm-udev deb-host-gnu-type-secure check-secure kysec2-package-plugins"
MICRO_INCLUDE="ca-certificates,tzdata,locales,libstdc++6"
BASE_INCLUDE="iproute2,libatm1t64,iputils-ping,lsof,zstd,unzip,vim-tiny,ca-certificates,tzdata,locales,perl,libdb5.3t64,python3,curl,procps,less,file,xz-utils,gnupg,passwd,mount,e2fsprogs,systemd,systemd-sysv,dbus,libsecurity1,libsecurity-conf,kytrust-bima,kytrusted-utils,libkytrusted-security"
DEVEL_INCLUDE="build-essential,pkg-config,dpkg-dev,bzip2,patch"
# 根因已定位并根治（见上面 PIN_NEVER 的注释），不再需要那个吸收 SIGSEGV 的包装器。
# 保留开关以备万一，默认关。历史与教训见 README §6。
DPKG_SEGV_WRAPPER=no
