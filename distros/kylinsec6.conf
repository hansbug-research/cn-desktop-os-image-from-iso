# 麒麟信安操作系统桌面版 V6 — openEuler 系（rpm），自研 Kiran 桌面
#
# 为什么把它列为第四个被试：见 report.md §2.5。它是名录里唯一同时满足
#   ① 交付端需求真实（电力调度、航天测发控自述部署 1 万余套、党政金融交通医疗）
#   ② 没有官方容器镜像可用（Docker Hub kylinsec 命名空间 0 个仓库）
#   ③ ISO 匿名可下（mirrorlists.kylinsec.com.cn 开放 autoindex）
# 的商业发行版；而且它是 **rpm 系**，把本项目原本只覆盖 deb 系的方法扩到另一种包格式。
#
# ⚠️ 桌面版只在 V6 线有：V6-SP1/x86_64 只有 KylinSec-Server，没有 Desktop（已实测目录）。
DID=kylinsec6
DISPLAY_NAME="麒麟信安桌面版 V6"
IMAGE=kylinsec-desktop-v6
FAMILY=rpm
METHOD=rpmmedia                   # 介质自带完整 rpm 仓库（Packages/ 2935 个 rpm + repodata/），
                                  # 无预装 rootfs 可切 —— 所以从介质的本地仓库 bootstrap，
                                  # 而不是像 UOS 那样切 squashfs（实测该 ISO 无 squashfs）
ISO_URL="https://mirrorlists.kylinsec.com.cn/iso/V6/x86_64/KylinSec-Desktop-6-release-250704-1154-x86_64.iso"
ISO_SHA256=ed404f08ef0f76e0a22e937959ada0e1e651b719a6c1a4de2f089c7a238c7d91   # 本地实测；官方同目录未提供校验文件
ISO_BYTES_EXPECT=4508876800      # 实测 content-length，见 report.md §2.1 的 ISO 获取一列
MEDIA_DIR=ks                      # media/ks —— 从 ISO 拷出的 Packages/ + repodata/（3.4 GB）
USRMERGE=yes
# 期望 ABI 基线：构建后由 gate/build-gates.sh 逐项核对，与 conf 不符即失败
# ABI 基线：从介质 rpm 实测（glibc-2.38-54.ks6.kb1、libstdc++-12.3.1-36.ks6 里的 so.6.0.30）
EXPECT_GLIBC=2.38
EXPECT_LIBSTDCPP=6.0.30
EXPECT_GLIBCXX=3.4.30
IMMUTABLE=no
# rpm 系的档位包集用 rpm 包名，不是 deb 名。与 deb 侧一一对应的语义：
#   micro = 纯运行时；base = 平台可用（有包管理、能排查）；devel = 构建用
# ⚠️ 包名按 openEuler 系而非 RHEL：shadow-utils 在这里叫 shadow；
#    该介质只提供 glibc-all-langpacks（无按语言拆分的 glibc-langpack-zh）。
#    包名不对会被 tools/rpmmedia.py 的种子检查秒级拦下，不会挂死。
SLICE_MICRO="chkconfig,glibc,glibc-common,bash,coreutils,rpm,rpm-libs,filesystem,setup,basesystem,tzdata,ca-certificates,sed,grep,tar,gzip,findutils,diffutils,gawk,hostname,ncurses-base,ncurses-libs,shadow,util-linux,libgcc,libstdc++,zlib,openssl-libs,glibc-all-langpacks"
SLICE_BASE_EXTRA="iproute,iputils,vim-minimal,lsof,zstd,unzip,dnf,dnf-data,python3,curl,procps-ng,less,file,xz,systemd,dbus"
SLICE_DEVEL_EXTRA="gcc,gcc-c++,make,glibc-devel,libstdc++-devel,binutils,rpm-build,cpp"

# 显式钉死时间锚点。不写的话 lib/common.sh::derive_epoch 会走「非 http 源」那一支
# 静默回落到硬编码的 1700000000 —— 值是确定的、逐位复现照样成立，但复核者读这份
# conf 找不到时间锚点从哪来，而 §9.1 正批评那个静默回落。显式优于隐式。
# 取值与回落值一致，所以此前的产物哈希不变。
SOURCE_DATE_EPOCH=1700000000

# RH 系惯例：/etc/shadow 是 000 root:root，比 Debian 的 0640 root:shadow 更严。
EXPECT_SHADOW=0:0/0

# 麒麟信安自带的 rpm 4.18.2 编译时把数据库后端设成 ndb（镜像内 `rpm -E %{_db_backend}`
# 实测为 ndb），而 builder 的 rpm 4.20 默认写 sqlite。不指定就会产出一个「文件都在、
# rpm -qa 返回 0」的镜像。tools/rpmmedia.py 装完会用目标自己的 rpm 核对条数。
RPM_DB_BACKEND=ndb

# 为什么显式列 chkconfig：p11-kit-trust 要求 /usr/sbin/update-alternatives，这是
# **路径型依赖**。路径型依赖只登记在 repodata 的 filelists.xml 里，而闭包只解析
# primary.xml，所以求不出提供者（tools/rpmmedia.py 会把这类未解析项打印出来）。
# 漏掉它不会让安装失败（装的时候带了 --nodeps），而是让镜像内 `dnf check` 报一条
# missing requires —— 这个缺口是靠能力探针的「已装包依赖自洽」那一项抓到的。
